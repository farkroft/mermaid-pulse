<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MermaidPulse turns Mermaid architecture diagrams into a live traffic simulator with packet pulses, latency telemetry, and chaos injection." />
    <title>MermaidPulse: Live Mermaid Traffic Simulator</title>
    <script>
      // Resolve the theme before first paint to avoid a flash of the wrong palette.
      (function () {
        try {
          var saved = window.localStorage.getItem("mermaidpulse-theme");
          var mql = window.matchMedia ? window.matchMedia("(prefers-color-scheme: light)") : null;
          document.documentElement.dataset.theme =
            saved === "light" || saved === "dark" ? saved : mql && mql.matches ? "light" : "dark";
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
